<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>عيد ميلاد سعيد يا أغلى ما في حياتي ✨❤️</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cosmicDark: "#06020f",
            cosmicDeep: "#14052b",
            romanticPink: "#ff4382",
            neonRose: "#ff2a70",
            warmGold: "#ffd066",
            sparkleGold: "#ffe58f",
          },
          fontFamily: {
            cairo: ["Cairo", "sans-serif"],
          },
        },
      },
    };
  </script>

  <!-- Google Font Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Libraries: Three.js r128, GSAP, Canvas Confetti -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06020f;
      font-family: 'Cairo', sans-serif;
      color: #ffffff;
    }

    /* Background WebGL & Canvas Layers */
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      display: block;
    }

    #trail-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
    }

    /* Ambient Floating Hearts Container */
    #ambient-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -60px;
      animation: floatUpward linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 67, 130, 0.8));
    }

    @keyframes floatUpward {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      15% {
        opacity: 0.8;
      }
      85% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Main UI Layer */
    #ui-container {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      pointer-events: none;
    }

    .interactive-element {
      pointer-events: auto;
    }

    /* Glassmorphism Luxury Styling */
    .glass-panel {
      background: rgba(25, 7, 43, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7), 
                  0 0 30px 2px rgba(255, 67, 130, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border-radius: 1.75rem;
    }

    /* Glowing Text & Shadows */
    .glow-text-pink {
      text-shadow: 0 0 12px rgba(255, 67, 130, 0.7), 0 0 25px rgba(255, 67, 130, 0.4);
    }
    .glow-text-gold {
      text-shadow: 0 0 12px rgba(255, 208, 102, 0.8), 0 0 25px rgba(255, 208, 102, 0.4);
    }

    /* Sound/Music Button */
    .music-btn {
      position: fixed;
      top: 1.25rem;
      left: 1.25rem;
      width: 3.25rem;
      height: 3.25rem;
      border-radius: 50%;
      background: rgba(25, 8, 45, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 208, 102, 0.4);
      box-shadow: 0 0 20px rgba(255, 67, 130, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      pointer-events: auto;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .music-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255, 208, 102, 0.7);
    }
    .spinning-vinyl {
      animation: spin 5s linear infinite;
    }
    .spinning-vinyl.paused {
      animation-play-state: paused;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Holographic Foil effect */
    .holographic-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(255,67,130,0.3) 100%);
      opacity: 0;
      pointer-events: none;
      border-radius: inherit;
      transition: opacity 0.2s ease;
    }

    /* Lanterns Floating Animation */
    .sky-lantern {
      position: fixed;
      bottom: -100px;
      width: 44px;
      height: 60px;
      background: radial-gradient(circle at 50% 70%, #ffeaa7 10%, #ff7675 60%, #d63031 95%);
      border-radius: 45% 45% 35% 35%;
      box-shadow: 0 0 25px 8px rgba(255, 177, 66, 0.8), 0 0 50px 15px rgba(255, 71, 87, 0.5);
      pointer-events: none;
      z-index: 8;
    }

    /* Custom Scrollbar for Letter */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 208, 102, 0.4);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Three.js Cosmic Canvas (3D particles, heart morphing, hyperspace warp) -->
  <canvas id="three-canvas"></canvas>

  <!-- Magic Finger / Cursor Stardust Trail Overlay -->
  <canvas id="trail-canvas"></canvas>

  <!-- Ambient Floating Hearts (Continuous Romantic Atmosphere) -->
  <div id="ambient-hearts"></div>

  <!-- Music Toggle (Vinyl Record) -->
  <div id="music-toggle" class="music-btn" title="الموسيقى الرومانسية">
    <div id="vinyl-icon" class="spinning-vinyl">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#ffd066" stroke-width="2" fill="#14052b"/>
        <circle cx="12" cy="12" r="6" stroke="#ff4382" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2.5" fill="#ffd066"/>
      </svg>
    </div>
  </div>

  <!-- Main Dynamic UI Container -->
  <main id="ui-container"></main>

  <!-- Audio Element -->
  <audio id="romantic-audio" preload="auto" loop></audio>

  <!-- Master Application Script -->
  <script src="script.js"></script>
</body>
</html>
